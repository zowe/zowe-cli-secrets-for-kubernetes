name: zowe-cli-plugin

on: [push, pull_request, workflow_dispatch]

jobs:
    test:
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && !contains(github.event.head_commit.message, '[ci skip]')
        runs-on: ${{ matrix.os }}
        outputs:
            npm-resolutions: ${{ steps.npm-update.outputs.result }}

        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x]
                os: [windows-latest, ubuntu-latest, macos-latest]

        env:
            OS: ${{ matrix.os }}
            NODE: ${{ matrix.node-version }}
            NODE_OPTIONS: --max_old_space_size=4096

        timeout-minutes: 60

        concurrency:
            group: ${{ matrix.os }}-node-${{ matrix.node-version }}-ci-${{ github.ref }}
            cancel-in-progress: true

        steps:
            - name: Checkout
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Disable Lint Annotations
              run: |
                  echo "::remove-matcher owner=eslint-compact::"
                  echo "::remove-matcher owner=eslint-stylish::"
            - name: Update NPM
              run: npm install -g npm@8

            - name: Install Dependencies
              run: npm ci

            - name: Update Dependencies
              id: npm-update
              uses: zowe-actions/octorelease/script@e0672bf28f74f36219713afe75915ea2dc7bf85b # v1
              with:
                  script: npmUpdate

            - name: Build Source
              id: build
              run: npm run build

            - name: Unit Tests
              if: ${{ always() && steps.build.outcome == 'success' }}
              run: npm run test:unit

            - name: Start K3s Cluster
              id: k3s
              if: ${{ always() && steps.build.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
              uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1

            - name: Set K8s Namespace
              if: ${{ always() && steps.k3s.outcome == 'success' }}
              run: kubectl config set-context --current --namespace=default

            - name: Create System Test Properties
              if: ${{ always() && steps.k3s.outcome == 'success' }}
              run: >
                  echo "zosmf:
                    user: ibmuser
                    pass: plaintext
                    host: localhost
                    port: 12345
                    " > packages/cli/__tests__/__resources__/properties/custom_properties.yaml
            - name: System Tests
              if: ${{ always() && steps.k3s.outcome == 'success' }}
              run: npm run test:system

            - name: Archive Results
              if: ${{ always() && steps.build.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ${{ matrix.os }}-${{ matrix.node-version }}-results
                  path: __tests__/__results__/

            - name: Upload Results to Codecov
              if: ${{ always() && steps.build.outcome == 'success' }}
              uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
              with:
                  env_vars: OS,NODE

    release:
        if: github.event_name == 'push' && github.ref_protected
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.ref }}

            - name: Use Node.js LTS
              uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
              with:
                  node-version: "lts/*"

            - name: Install Dependencies
              run: npm ci

            - name: Install Lerna
              run: npm install -g lerna@6

            - name: Update Dependencies
              uses: zowe-actions/octorelease/script@e0672bf28f74f36219713afe75915ea2dc7bf85b # v1
              env:
                  GIT_COMMITTER_NAME: ${{ secrets.ZOWE_ROBOT_USER }}
                  GIT_COMMITTER_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
                  NPM_RESOLUTIONS: ${{ needs.test.outputs.npm-resolutions }}
              with:
                  script: npmUpdate

            - name: Build Source
              run: npm run build

            - uses: zowe-actions/octorelease@e0672bf28f74f36219713afe75915ea2dc7bf85b # v1
              env:
                  GIT_COMMITTER_NAME: ${{ secrets.ZOWE_ROBOT_USER }}
                  GIT_COMMITTER_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
                  GIT_CREDENTIALS: x-access-token:${{ secrets.ZOWE_ROBOT_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
                  NPM_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
                  NPM_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
                  OVSX_PAT: ${{ secrets.VSCODE_OVSX_PUBLISHER_TOKEN }}
                  VSCE_PAT: ${{ secrets.VSCODE_VSCE_PUBLISHER_TOKEN }}
